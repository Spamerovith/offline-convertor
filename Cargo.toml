[package]
name = "offline-convertor"
version = "1.2.2"
edition = "2021"
description = "Offline Convertor - offline media converter and compressor"
default-run = "offline-convertor"
license = "GPL-3.0-or-later"

[[bin]]
name = "offline-convertor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
zstd = { version = "0.13", features = ["zstdmt"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "webp", "ico", "tga", "pnm", "qoi", "hdr", "rayon"] }
mozjpeg = "0.10"
imagequant = "4"
oxipng = { version = "10", default-features = false, features = ["parallel"] }
lopdf = "0.47"
docx-rs = "0.4"
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
    "Data_Pdf",
    "Security_Cryptography",
    "Win32_System_WinRT",
    "Win32_System_Com",
] }
windows-future = "0.3"
png = "0.18"
rayon = "1"
pdf-extract = "0.12"
zstd = "0.13"
ssimulacra2 = "0.5"
ureq = { version = "3", features = ["json"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
